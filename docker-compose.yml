services:
  postgres:
    image: postgres:16-alpine
    container_name: ecc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecc_user
      POSTGRES_PASSWORD: ecc_password
      POSTGRES_DB: ecc_platform
    ports:
      - "5432:5432"
    volumes:
      - ecc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc_user -d ecc_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ecc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecc-postgres-data:
  ecc-redis-data:
