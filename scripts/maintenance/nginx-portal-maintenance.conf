# Mode maintenance Portal — dipakai oleh perintah `portal-maintenance <menit> | off`.
# Dipasang di server block portal.eccchurch.global (443) lewat:
#   include snippets/portal-maintenance.conf;
# Bendera: /var/www/portal-maintenance/on → semua halaman Portal menampilkan
# halaman maintenance (HTTP 503 + Retry-After). API (api.eccchurch.global) & Els App tidak terpengaruh.
set $portal_maint 0;
if (-f /var/www/portal-maintenance/on) { set $portal_maint 1; }
if ($uri ~ ^/__maintenance/) { set $portal_maint 0; }
if ($portal_maint = 1) { return 503; }

error_page 503 @portal_maintenance;
location @portal_maintenance {
  root /var/www/portal-maintenance;
  rewrite ^ /index.html break;
  default_type text/html;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "600" always;
}
location = /__maintenance/status.json {
  alias /var/www/portal-maintenance/status.json;
  default_type application/json;
  add_header Cache-Control "no-store" always;
}
